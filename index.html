<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Pagamento</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #151820;
    --surface2: #1c2030;
    --border: #252a3a;
    --accent: #f0b429;
    --accent2: #e8813a;
    --green: #2dd98f;
    --red: #ff5e5e;
    --blue: #4a9eff;
    --text: #e8ecf5;
    --muted: #6b7494;
    --blocked: #ff5e5e22;
    --blocked-border: #ff5e5e55;
    --free: #2dd98f22;
    --free-border: #2dd98f55;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    padding: 0;
    overflow-x: hidden;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.3;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 960px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }

  /* Header */
  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 48px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 16px;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .brand-label {
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 500;
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(28px, 5vw, 44px);
    font-weight: 800;
    line-height: 1;
    color: var(--text);
  }

  h1 span {
    color: var(--accent);
  }

  .date-display {
    text-align: right;
  }

  .date-display .today-label {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    display: block;
    margin-bottom: 4px;
  }

  .date-display .today-date {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
  }

  /* Summary cards */
  .summary {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 40px;
  }

  .sum-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }

  .sum-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
  }

  .sum-card.total::before { background: var(--blue); }
  .sum-card.blocked::before { background: var(--red); }
  .sum-card.free::before { background: var(--green); }

  .icon-svg {
    display: inline-block;
    vertical-align: middle;
    flex-shrink: 0;
  }

  .sum-label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .sum-value {
    font-family: 'Syne', sans-serif;
    font-size: clamp(18px, 3vw, 26px);
    font-weight: 700;
  }

  .sum-card.total .sum-value { color: var(--blue); }
  .sum-card.blocked .sum-value { color: var(--red); }
  .sum-card.free .sum-value { color: var(--green); }

  /* Add entry section */
  .add-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 32px;
  }

  .section-title {
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .form-row {
    display: grid;
    grid-template-columns: 160px 1fr auto;
    gap: 12px;
    align-items: end;
    max-width: 520px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  label {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
  }

  input[type="date"],
  input[type="number"],
  input[type="text"] {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    width: 100%;
  }

  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px #f0b42915;
  }

  input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(0.7);
    cursor: pointer;
  }

  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  input[type="number"] {
    -moz-appearance: textfield;
  }

  .btn {
    padding: 12px 24px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .btn-primary {
    background: var(--accent);
    color: #0d0f14;
  }

  .btn-primary:hover {
    background: #f5c84a;
    transform: translateY(-1px);
    box-shadow: 0 4px 20px #f0b42940;
  }

  .btn-primary:active { transform: translateY(0); }

  .btn-sm {
    padding: 7px 14px;
    font-size: 11px;
    border-radius: 6px;
  }

  .btn-danger {
    background: transparent;
    border: 1px solid var(--red);
    color: var(--red);
  }

  .btn-danger:hover {
    background: var(--red);
    color: white;
  }

  .btn-success {
    background: transparent;
    border: 1px solid var(--green);
    color: var(--green);
  }

  .btn-success:hover {
    background: var(--green);
    color: #0d0f14;
  }

  /* Entries list */
  .entries-header {
    display: grid;
    grid-template-columns: 110px 130px 130px 130px 100px;
    gap: 12px;
    padding: 10px 20px;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .entry {
    display: grid;
    grid-template-columns: 110px 130px 130px 130px 100px;
    gap: 12px;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 8px;
    transition: all 0.25s;
    animation: slideIn 0.3s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .entry:hover { border-color: #333a50; }

  .entry.status-blocked {
    background: var(--blocked);
    border-color: var(--blocked-border);
  }

  .entry.status-free {
    background: var(--free);
    border-color: var(--free-border);
  }

  .entry.status-overdue {
    background: #ff3e3e11;
    border-color: #ff3e3e44;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { border-color: #ff3e3e44; }
    50% { border-color: #ff3e3e99; }
  }

  .entry-date {
    font-size: 13px;
    color: var(--text);
    font-weight: 500;
  }

  .entry-desc {
    font-size: 13px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .entry-value {
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 700;
  }

  .value-blocked { color: var(--red); }
  .value-free { color: var(--green); }

  .pay-date {
    font-size: 12px;
    color: var(--muted);
  }

  .pay-date.soon {
    color: var(--accent2);
    font-weight: 500;
  }

  .pay-date.overdue {
    color: var(--red);
    font-weight: 500;
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 100px;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .badge-blocked {
    background: #ff5e5e20;
    color: var(--red);
    border: 1px solid var(--blocked-border);
  }

  .badge-free {
    background: #2dd98f20;
    color: var(--green);
    border: 1px solid var(--free-border);
  }

  .badge-overdue {
    background: #ff3e3e20;
    color: #ff3e3e;
    border: 1px solid #ff3e3e44;
  }

  .badge-overdue .svg-icon {
    animation: blink 1s infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }

  .actions {
    display: flex;
    gap: 6px;
    justify-content: flex-end;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }

  .empty-state .icon {
    font-size: 48px;
    margin-bottom: 16px;
    opacity: 0.4;
  }

  .empty-state p {
    font-size: 13px;
    letter-spacing: 1px;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 30px;
    right: 30px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 22px;
    font-size: 13px;
    color: var(--text);
    z-index: 999;
    transform: translateY(80px);
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .toast.show {
    transform: translateY(0);
    opacity: 1;
  }

  .toast.success { border-color: var(--free-border); }
  .toast.warning { border-color: var(--blocked-border); }

  /* Responsive */
  @media (max-width: 700px) {
    .entries-header { display: none; }

    .entry {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto;
      gap: 8px;
    }

    .entry-date { grid-column: 1; }
    .entry-value { grid-column: 1; }
    .pay-date { grid-column: 2; text-align: right; }
    .status-badge { width: fit-content; }
    .actions { grid-column: 1 / -1; justify-content: flex-start; }

    .form-row {
      grid-template-columns: 1fr 1fr;
      max-width: 100%;
    }

    .form-row .btn {
      grid-column: 1 / -1;
    }

    .summary {
      grid-template-columns: 1fr 1fr;
    }
  }

  @media (max-width: 900px) and (min-width: 701px) {
    .entries-header,
    .entry {
      grid-template-columns: 110px 120px 110px 110px 90px;
    }
  }
</style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <header>
    <div class="brand">
      <span class="brand-label">Sistema de Pagamento</span>
      <h1>FOLHA <span>PAGO</span></h1>
    </div>
    <div class="date-display">
      <span class="today-label">Hoje</span>
      <span class="today-date" id="todayDate">—</span>
    </div>
  </header>

  <!-- Resumo -->
  <div class="summary">
    <div class="sum-card blocked">
      <div class="sum-label">
        <svg class="icon-svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Bloqueado
      </div>
      <div class="sum-value" id="sumBlocked">R$ 0,00</div>
    </div>
    <div class="sum-card free">
      <div class="sum-label">
        <svg class="icon-svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        Liberado
      </div>
      <div class="sum-value" id="sumFree">R$ 0,00</div>
    </div>
  </div>

  <!-- Adicionar Entrada -->
  <div class="add-section">
    <div class="section-title">Nova Entrada</div>
    <div class="form-row">
      <div class="field">
        <label>Data</label>
        <input type="date" id="inputDate">
      </div>
      <div class="field">
        <label>Valor (R$)</label>
        <input type="number" id="inputValue" placeholder="0,00" step="0.01" min="0">
      </div>
      <button class="btn btn-primary" onclick="window._addEntry()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:6px;margin-top:-2px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Adicionar
      </button>
    </div>
    <div style="margin-top:12px; font-size:11px; color:var(--muted); letter-spacing:1px; display:flex; align-items:center; gap:6px;">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      Pagamento liberado 4 dias após a data escolhida.
    </div>
  </div>

  <!-- Lista -->
  <div class="section-title" style="margin-bottom:12px; font-family:'Syne',sans-serif; font-size:14px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:10px;">
    Registros
    <span style="flex:1;height:1px;background:var(--border);display:block;"></span>
    <span id="entryCount" style="font-size:11px;">0 entradas</span>
  </div>

  <div class="entries-header">
    <span>Data Ref.</span>
    <span>Valor</span>
    <span>Libera Em</span>
    <span>Status</span>
    <span style="text-align:right">Ações</span>
  </div>

  <div id="entriesList">
    <div class="empty-state">
      <div class="icon"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg></div>
      <p>Nenhum registro ainda. Adicione a primeira entrada acima.</p>
    </div>
  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>


<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, push, remove, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDz4sZI2U94dA9amLBWFNfvXzr-POxbuYA",
    authDomain: "adenilton-pagamento.firebaseapp.com",
    databaseURL: "https://adenilton-pagamento-default-rtdb.firebaseio.com",
    projectId: "adenilton-pagamento",
    storageBucket: "adenilton-pagamento.firebasestorage.app",
    messagingSenderId: "420746893077",
    appId: "1:420746893077:web:32aef4696877d5e1e87b1c"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const entriesRef = ref(db, 'folha_pago_entries');

  // ---- Helpers ----
  function today() {
    return new Date().toISOString().split('T')[0];
  }

  function formatDate(dateStr) {
    const [y, m, d] = dateStr.split('-');
    return `${d}/${m}/${y}`;
  }

  function formatCurrency(val) {
    return val.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }

  function addDays(dateStr, days) {
    const d = new Date(dateStr + 'T12:00:00');
    d.setDate(d.getDate() + days);
    return d.toISOString().split('T')[0];
  }

  function daysDiff(a, b) {
    const da = new Date(a + 'T12:00:00');
    const db = new Date(b + 'T12:00:00');
    return Math.round((da - db) / 86400000);
  }

  // ---- Render ----
  function render(entries) {
    const todayStr = today();
    const list = document.getElementById('entriesList');
    const count = document.getElementById('entryCount');

    // Sort by date desc
    const sorted = [...entries].sort((a, b) => b.date.localeCompare(a.date));

    count.textContent = `${sorted.length} entrada${sorted.length !== 1 ? 's' : ''}`;

    let blocked = 0, free = 0;

    sorted.forEach(e => {
      const payDate = addDays(e.date, 4);
      const diff = daysDiff(payDate, todayStr);
      if (diff <= 0) free += e.value;
      else blocked += e.value;
    });

    // Update total card
    const totalEl = document.getElementById('sumTotal');
    if (totalEl) totalEl.textContent = formatCurrency(blocked + free);

    document.getElementById('sumBlocked').textContent = formatCurrency(blocked);
    document.getElementById('sumFree').textContent = formatCurrency(free);

    if (sorted.length === 0) {
      list.innerHTML = `<div class="empty-state"><div class="icon"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg></div><p>Nenhum registro ainda. Adicione a primeira entrada acima.</p></div>`;
      return;
    }

    list.innerHTML = sorted.map(entry => {
      const payDate = addDays(entry.date, 4);
      const diff = daysDiff(payDate, todayStr);
      const isFree = diff <= 0;
      const isSoon = diff === 1 || diff === 2;
      const isOverdue = diff < 0;

      let statusClass = isFree ? 'status-free' : (isOverdue ? 'status-overdue' : 'status-blocked');
      let valueClass = isFree ? 'value-free' : 'value-blocked';

      let badge, payLabel;

      if (isFree) {
        badge = `<span class="status-badge badge-free"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>Liberado</span>`;
        payLabel = `<span class="pay-date" style="color:var(--green)">Liberado</span>`;
      } else if (diff < 0) {
        badge = `<span class="status-badge badge-overdue"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>Atrasado</span>`;
        payLabel = `<span class="pay-date overdue">${formatDate(payDate)}</span>`;
      } else if (isSoon) {
        badge = `<span class="status-badge badge-blocked" style="border-color:#e8813a55;color:var(--accent2)"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Em breve</span>`;
        payLabel = `<span class="pay-date soon">${formatDate(payDate)}</span>`;
      } else {
        badge = `<span class="status-badge badge-blocked"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Bloqueado</span>`;
        payLabel = `<span class="pay-date">${formatDate(payDate)}</span>`;
      }

      return `
        <div class="entry ${statusClass}" data-id="${entry.firebaseKey}">
          <span class="entry-date">${formatDate(entry.date)}</span>
          <span class="entry-value ${valueClass}">${formatCurrency(entry.value)}</span>
          ${payLabel}
          ${badge}
          <div class="actions">
            <button class="btn btn-sm btn-danger" onclick="window._deleteEntry('${entry.firebaseKey}')" title="Remover">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
        </div>
      `;
    }).join('');
  }

  // ---- Real-time listener ----
  onValue(entriesRef, (snapshot) => {
    const data = snapshot.val();
    const entries = [];
    if (data) {
      Object.keys(data).forEach(key => {
        entries.push({ ...data[key], firebaseKey: key });
      });
    }
    render(entries);
  });

  // ---- Add ----
  window._addEntry = function() {
    const valueEl = document.getElementById('inputValue');
    const dateEl = document.getElementById('inputDate');
    const value = parseFloat(valueEl.value);
    const date = dateEl.value;

    if (!date) { showToast('Selecione uma data.', 'warning'); return; }
    if (!value || value <= 0) { showToast('Informe um valor válido.', 'warning'); return; }

    push(entriesRef, { date, value })
      .then(() => {
        valueEl.value = '';
        dateEl.value = today();
        const payDate = addDays(date, 4);
        showToast(`Entrada adicionada! Libera em ${formatDate(payDate)}.`, 'success');
      })
      .catch(() => showToast('Erro ao salvar. Verifique a conexão.', 'warning'));
  };

  // ---- Delete ----
  window._deleteEntry = function(firebaseKey) {
    const itemRef = ref(db, `folha_pago_entries/${firebaseKey}`);
    remove(itemRef)
      .then(() => showToast('Entrada removida.', 'warning'))
      .catch(() => showToast('Erro ao remover.', 'warning'));
  };

  // ---- Toast ----
  function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    const icon = type === 'success'
      ? `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`
      : `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--accent2)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`;
    t.innerHTML = `${icon} ${msg}`;
    t.className = `toast ${type} show`;
    setTimeout(() => { t.className = 'toast'; }, 3000);
  }

  // ---- Init ----
  document.getElementById('todayDate').textContent = formatDate(today());
  document.getElementById('inputDate').value = today();

  // Auto-refresh date display a cada minuto
  setInterval(() => {
    document.getElementById('todayDate').textContent = formatDate(today());
  }, 60000);

  // Enter para adicionar
  document.getElementById('inputValue').addEventListener('keydown', e => {
    if (e.key === 'Enter') window._addEntry();
  });
</script>
</body>
</html>
